<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="语音对话">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/chat.webmanifest">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>语音对话 · ethan-tts</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="chat-app" id="chat-app">
  <!-- Conversation history -->
  <aside class="rail" id="rail" aria-label="对话历史">
    <div class="rail-head">
      <a class="rail-brand" href="/"><span class="rail-logo">e<span>·</span></span><span>语音对话</span></a>
      <button class="rail-close" id="rail-close" aria-label="关闭">×</button>
    </div>
    <button class="new-chat" id="new-chat">＋ 新的对话</button>
    <div class="rail-list" id="session-list"></div>
    <div class="rail-foot">
      <a class="rail-link" href="/#settings/model"><span>⚙</span>模型设置</a>
      <a class="rail-link" href="/"><span>⌁</span>合成工作台</a>
      <button class="rail-link" id="theme-toggle"><span>◐</span>切换外观</button>
    </div>
  </aside>
  <div class="rail-mask" id="rail-mask" hidden></div>

  <main class="stage">
    <header class="stage-head">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="对话历史">☰</button>
      <div class="stage-title">
        <strong id="session-title">新的对话</strong>
        <span id="stage-sub">本地语音 · 说话即问</span>
      </div>
      <div class="stage-actions">
        <span class="model-chip" id="model-chip" title="当前对话模型">未配置模型</span>
        <button class="icon-btn" id="stop-btn" title="停止朗读" hidden>■</button>
      </div>
    </header>

    <!-- Not configured / missing model banner -->
    <section class="notice" id="setup-notice" hidden>
      <div class="notice-icon">⚙</div>
      <div class="notice-body">
        <strong id="setup-title">还没有配置对话模型</strong>
        <p id="setup-text">语音对话需要一个模型来回答。先去设置页填好地址和 API Key，回来就能直接说话。</p>
      </div>
      <a class="notice-action" id="setup-action" href="/#settings/model">去设置 →</a>
    </section>

    <!-- Transcript -->
    <div class="thread" id="thread" role="log" aria-live="polite"></div>

    <!-- Idle: the breathing orb -->
    <div class="hero" id="hero">
      <div class="orb-wrap">
        <div class="orb idle" id="orb">
          <span class="orb-ring"></span><span class="orb-ring r2"></span><span class="orb-ring r3"></span>
          <div class="bars" id="bars"></div>
        </div>
      </div>
      <h1 id="hero-title">按一下，开始说话</h1>
      <p id="hero-sub">我会听你说完，然后用语音回答你</p>
    </div>

    <div class="typing" id="typing" hidden><span></span><span></span><span></span><em id="typing-label">正在思考…</em></div>

    <!-- Composer -->
    <footer class="composer" id="composer">
      <div class="composer-inner">
        <input id="text-input" class="text-input" placeholder="也可以直接打字…" autocomplete="off" enterkeyhint="send">
        <button class="mic" id="mic-btn" aria-label="按住说话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15Zm5.5-3.5a5.5 5.5 0 0 1-11 0H4.5a7.5 7.5 0 0 0 6.5 7.43V21h2v-2.07a7.5 7.5 0 0 0 6.5-7.43H17.5Z"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composer-hint">按住说话 · 停顿 1.2 秒自动发送</div>
      <div class="rec-bar" id="rec-bar" hidden>
        <div class="rec-dot"></div><span id="rec-text">正在听…</span>
        <button class="rec-cancel" id="rec-cancel">取消</button>
        <button class="rec-send" id="rec-send">说完了</button>
      </div>
    </footer>
  </main>
</div>
<div id="toast-container" aria-live="polite"></div>
<script src="/static/chat.js"></script>
</body>
</html>
