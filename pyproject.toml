[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethan-tts"
version = "0.2.0"
description = "Local Qwen3-TTS voice studio and agent-friendly CLI for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # 推理
  "mlx-audio==0.6.4",
  "mlx>=0.21",
  "numpy>=1.26",
  # Web 服务
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "pydantic>=2.6",
  # 模型下载（download_model.py）与语音对话页调用模型（llm.py）
  "huggingface_hub>=0.23",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[project.scripts]
ethan-tts = "cli:main"

[tool.setuptools]
# 这是「模块目录里的一堆 .py」，不是常规 package，所以用 py-modules 逐个列。
py-modules = [
  "app", "cli", "config", "db", "engine", "download_model",
  "stt", "llm", "chat", "setup_cmd",
]

# static/ 必须真的进 wheel，否则装完打开 8765 是空白页 / /chat.webmanifest 报 500。
# 注意：py-modules 布局下 `[tool.setuptools.package-data]` 是**不生效**的
# （它只作用于真正的 package），必须用 data-files 显式声明。
# 装在 sys.prefix/static，config.STATIC_DIR 会按「源码目录 → sys.prefix」查找。
[tool.setuptools.data-files]
"static" = [
  "static/app.js",
  "static/chat.css",
  "static/chat.html",
  "static/chat.js",
  "static/chat.webmanifest",
  "static/favicon.svg",
  "static/index.html",
  "static/select.js",
  "static/style.css",
]
