[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethan-tts"
version = "0.2.0"
description = "Local Qwen3-TTS voice studio and agent-friendly CLI for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # 推理
  "mlx-audio==0.6.4",
  "mlx>=0.21",
  "numpy>=1.26",
  # Web 服务
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.33",
  "pydantic>=2.6",
  # 模型下载（download_model.py）与语音对话页调用模型（llm.py）
  "huggingface_hub>=0.23",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[project.scripts]
ethan-tts = "cli:main"

[tool.setuptools]
# 这是「模块目录里的一堆 .py」，不是常规 package，只能逐个列。
py-modules = [
  "app", "cli", "config", "db", "engine", "download_model",
  "stt", "llm", "chat", "setup_cmd", "server_cmd", "single_instance",
]

# 网页界面必须打进 wheel，否则装完打开 8765 是空白页。
# setuptools 对 py-modules 不会自动收顶层目录下的非 .py 文件，只能显式列。
[tool.setuptools.data-files]
"static" = ["static/*"]
